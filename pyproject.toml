[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-forgetting"
version = "0.1.0"
description = "Minimal reproducibility code for RSF forget-only unlearning experiments."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "timm>=1.0,<1.1",
  "tomli>=2.0; python_version<'3.11'",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm>=4.67",
]

[project.scripts]
shape-forgetting = "shape_forgetting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
